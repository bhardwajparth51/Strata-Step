services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultflow_postgres
    environment:
      POSTGRES_USER: vaultflow
      POSTGRES_PASSWORD: vaultflow
      POSTGRES_DB: vaultflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultflow -d vaultflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaultflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
